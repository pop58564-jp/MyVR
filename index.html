<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Cyberpunk City VR</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>

<body>
  <a-scene>

    <!-- 3Dモデルの読み込み -->
    <a-assets>
      <a-asset-item
        id="city"
        src="models/cyberpunk_city.glb">
      </a-asset-item>
    </a-assets>

    <!-- 街の配置 -->
    <a-entity
      gltf-model="#city"
      position="0 0 -5"
      scale="1 1 1">
    </a-entity>

    <!-- カメラ -->
    <a-camera position="0 2 5"></a-camera>

    <!-- 背景 -->
    <a-sky color="#080818"></a-sky>

  </a-scene>
</body>
</html>
