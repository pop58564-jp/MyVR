<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>anime_class_room VR</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>

<body>
  <a-scene background="color: #87CEEB">

    <!-- 明るさ調整 -->
    <a-light type="ambient" color="#FFFFFF" intensity="2"></a-light>
    <a-light type="directional"
             position="0 10 5"
             color="#FFFFFF"
             intensity="2"></a-light>

    <!-- 3Dモデル -->
    <a-assets>
      <a-asset-item
        id="classroom"
        src="models/anime_class_room.glb">
      </a-asset-item>
    </a-assets>

    <a-entity
      gltf-model="#classroom"
      position="0 0 -5"
      scale="1 1 1">
    </a-entity>

    <!-- カメラ -->
    <a-camera position="0 2 5"></a-camera>

  </a-scene>
</body>
</html>
